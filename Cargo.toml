[package]
name = "firma"
version = "0.2.0"
edition = "2021"
rust-version = "1.87"
description = "Command-line PAdES PDF signing, an alternative to AutoFirma"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
cmpv2 = "0.2.0"
cms = { version = "0.2.3", features = ["builder"] }
der = { version = "0.7", features = ["alloc", "oid"] }
dirs = "6"
ecdsa = { version = "0.16", features = ["der", "signing"] }
flate2 = "1"
hmac = "0.12"
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg"] }
lopdf = { version = "~0.40", default-features = false }
p12-keystore = "0.4.1"
p256 = { version = "0.13", features = ["ecdsa"] }
p384 = { version = "0.13", features = ["ecdsa"] }
rpassword = "7"
rsa = { version = "0.9", features = ["sha2"] }
serde = { version = "1", features = ["derive"] }
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
signature = "2"
spki = "0.7"
toml = "0.8"
ureq = "2"
x509-cert = "0.2"
x509-ocsp = "0.2.1"
x509-tsp = "0.1.0"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext", "LAPublicDefines"] }
security-framework = "3.7"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Security_Credentials_UI",
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Console",
    "Win32_System_WinRT",
] }
windows-future = "0.3"

[profile.release]
lto = true
strip = true
codegen-units = 1
