name: build

# Lint + build + smoke test on macOS, Linux and Windows for every push and pull request.
# Pushing a `v*` tag also publishes a GitHub release with the binaries.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked --all-targets -- -D warnings

  build:
    name: build (${{ matrix.name }})
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: x86_64-linux
            os: ubuntu-latest
            targets: x86_64-unknown-linux-musl
          - name: aarch64-linux
            os: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-musl
          - name: x86_64-windows
            os: windows-latest
            targets: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.name }}

      - name: Install musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        env:
          # Windows: link the C runtime statically so no VC++ redistributable is needed.
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
          TARGETS: ${{ matrix.targets }}
        run: |
          for t in ${TARGETS//,/ }; do
            cargo build --release --locked --target "$t"
          done

      - name: Collect binary
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            lipo -create -output dist/firma \
              target/aarch64-apple-darwin/release/firma target/x86_64-apple-darwin/release/firma
            lipo -info dist/firma
          elif [ "$RUNNER_OS" = "Windows" ]; then
            cp "target/$TARGETS/release/firma.exe" dist/
          else
            cp "target/$TARGETS/release/firma" dist/
            file dist/firma
          fi

      - name: Smoke test
        run: scripts/smoke-test.sh dist/firma

      - name: Package
        id: package
        env:
          NAME: ${{ matrix.name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then version="$REF_NAME"; else version="dev-${GITHUB_SHA::7}"; fi
          cp README.md dist/
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            archive="firma-$version-$NAME.zip"
            7z a "../$archive" firma.exe README.md
          else
            archive="firma-$version-$NAME.tar.gz"
            tar czf "../$archive" firma README.md
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum firma-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/*
          generate_release_notes: true
